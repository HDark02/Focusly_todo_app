name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ---------------------------------------------------------
      # 1. Récupérer le projet
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Installer Java 17
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 3. Installer Python 3.10
      # ---------------------------------------------------------
      - name: Setup Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # ---------------------------------------------------------
      # 4. Installer les dépendances système
      # ---------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint

      # ---------------------------------------------------------
      # 5. Installer Buildozer
      # ---------------------------------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install \
            buildozer \
            cython==3.0.11

      # ---------------------------------------------------------
      # 6. Cache Buildozer
      # ---------------------------------------------------------
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # ---------------------------------------------------------
      # 7. Nettoyer les anciens builds
      # ---------------------------------------------------------
      - name: Buildozer clean
        run: |
          buildozer android clean || true

          rm -rf bin

      # ---------------------------------------------------------
      # 8. Construire l'APK Debug
      # ---------------------------------------------------------
      - name: Build APK
        run: |
          buildozer -v android debug

      # ---------------------------------------------------------
      # 9. Afficher les fichiers générés
      # ---------------------------------------------------------
      - name: List APK
        run: |
          ls -lah bin/

      # ---------------------------------------------------------
      # 10. Publier l'APK comme artifact
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          if-no-files-found: error
